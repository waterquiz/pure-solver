<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Mobile Navigation Header -->
  <header class="lg:hidden flex items-center justify-between px-5 py-3.5 bg-white border-b border-slate-200">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm">
        <i class="fa-solid fa-bolt text-sm"></i>
      </div>
      <div>
        <span class="font-bold text-base text-slate-900 tracking-tight">Pure Kolo</span>
      </div>
    </div>
    <button id="mobile-menu-btn" class="text-slate-600 hover:text-slate-900 focus:outline-none">
      <i class="fa-solid fa-bars text-xl"></i>
    </button>
  </header>

  <div class="flex flex-1">
    <!-- Sidebar (Pure Kolo Style) -->
    <aside id="sidebar" class="w-64 bg-white border-r border-slate-200/80 flex flex-col justify-between hidden lg:flex fixed lg:static inset-y-0 left-0 z-40 transition-all select-none">
      <div>
        <!-- Brand Header with Lightning Bolt -->
        <div class="h-20 flex items-center px-6 border-b border-slate-100 space-x-3">
          <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
            <i class="fa-solid fa-bolt text-lg"></i>
          </div>
          <div>
            <h1 class="font-bold text-base text-slate-900 leading-tight tracking-tight">Pure Kolo</h1>
            <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">SESSION & IMAGE HUB</p>
          </div>
        </div>

        <!-- Navigation Links -->
        <nav class="p-4 space-y-1.5">
          <a href="/dashboard" class="nav-item flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-semibold transition text-slate-600 hover:bg-slate-50 hover:text-slate-900" data-route="/dashboard">
            <i class="fa-solid fa-house w-5 text-slate-400"></i>
            <span>Home</span>
          </a>
          <a href="/dashboard/api-keys" class="nav-item flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50 hover:text-slate-900" data-route="/dashboard/api-keys">
            <i class="fa-solid fa-key w-5 text-slate-400"></i>
            <span>Account & Keys</span>
          </a>
          <a href="/dashboard/api-test" class="nav-item flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50 hover:text-slate-900" data-route="/dashboard/api-test">
            <i class="fa-solid fa-server w-5 text-slate-400"></i>
            <span>Proxies & Test</span>
          </a>
          <a href="/dashboard/users" class="nav-item flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50 hover:text-slate-900" data-route="/dashboard/users">
            <i class="fa-solid fa-user-shield w-5 text-slate-400"></i>
            <span>Administrator</span>
          </a>
          <a href="/dashboard/settings" class="nav-item flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50 hover:text-slate-900" data-route="/dashboard/settings">
            <i class="fa-solid fa-gear w-5 text-slate-400"></i>
            <span>Settings</span>
          </a>
          <a href="/docs" class="nav-item flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50 hover:text-slate-900" data-route="/docs">
            <i class="fa-solid fa-book w-5 text-slate-400"></i>
            <span>API Docs</span>
          </a>
        </nav>
      </div>

      <!-- User Profile & Logout -->
      <div class="p-4 border-t border-slate-100 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs" id="user-avatar">
            U
          </div>
          <div class="overflow-hidden">
            <p class="text-xs font-semibold text-slate-800 truncate" id="user-display-name">Admin</p>
            <p class="text-[10px] text-slate-400 truncate" id="user-role-badge">Administrator</p>
          </div>
        </div>
        <button id="logout-btn" class="p-1.5 text-slate-400 hover:text-rose-600 transition" title="Sign Out">
          <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 bg-[#f8fafc]">
      <!-- Page Content -->
      <main class="flex-1 p-6 lg:p-8 overflow-y-auto">
        {% block content %}{% endblock %}
      </main>

      <!-- Footer Bar -->
      <footer class="px-8 py-4 border-t border-slate-200/60 bg-white/60 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400 gap-2">
        <p>© 2026 Pure Kolo. All rights reserved.</p>
        <div class="flex items-center space-x-4">
          <a href="/docs" class="hover:text-slate-600">Documentation</a>
          <a href="/dashboard/settings" class="hover:text-slate-600">Settings</a>
          <a href="/dashboard/users" class="hover:text-slate-600">Administrator</a>
        </div>
      </footer>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Global JavaScript -->
  <script src="/static/js/auth.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
