<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - {{ app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="w-full max-w-md bg-white border border-slate-200/80 rounded-2xl shadow-xl p-8 space-y-6">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex w-12 h-12 rounded-xl bg-blue-600 items-center justify-center text-white text-xl shadow-md shadow-blue-500/20 mb-1">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">{{ app_name }}</h1>
      <p class="text-xs text-slate-500">Sign in to access your remote image display & AI solver hub</p>
    </div>

    <!-- Alert Box -->
    <div id="login-error" class="hidden p-3.5 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 flex items-center space-x-2">
      <i class="fa-solid fa-triangle-exclamation text-rose-500"></i>
      <span id="login-error-msg">Invalid username or password</span>
    </div>

    <!-- Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5" for="username">Username or Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <i class="fa-solid fa-user text-sm"></i>
          </span>
          <input type="text" id="username" required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
            placeholder="admin or user@domain.com">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5" for="password">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <i class="fa-solid fa-lock text-sm"></i>
          </span>
          <input type="password" id="password" required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
            placeholder="••••••••">
        </div>
      </div>

      <button type="submit" id="submit-btn"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm transition duration-150 flex items-center justify-center space-x-2 shadow-sm">
        <span>Sign In to Dashboard</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <!-- Footer Notice -->
    <div class="text-center text-xs text-slate-500 border-t border-slate-100 pt-4">
      <p>Default credentials: <code class="text-slate-700 bg-slate-100 font-bold px-1.5 py-0.5 rounded">admin</code> / <code class="text-slate-700 bg-slate-100 font-bold px-1.5 py-0.5 rounded">admin123</code></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const errorMsg = document.getElementById('login-error-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Signing in...</span>';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username_or_email: username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorBox.classList.remove('hidden');
          errorMsg.textContent = data.detail || 'Sign in failed. Check your credentials.';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In to Dashboard</span><i class="fa-solid fa-arrow-right text-xs"></i>';
          return;
        }

        localStorage.setItem('auth_token', data.access_token);
        localStorage.setItem('auth_user', JSON.stringify(data.user));

        window.location.href = '/dashboard';
      } catch (err) {
        errorBox.classList.remove('hidden');
        errorMsg.textContent = 'Network error connecting to the server.';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In to Dashboard</span><i class="fa-solid fa-arrow-right text-xs"></i>';
      }
    });
  </script>
</body>
</html>
